services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dreamcity-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # API 密钥通过 .env 文件注入，不要硬编码
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_URL=${OPENAI_API_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
